[package]
name = "az_trainer"
version = "1.5.2"
edition = "2021"
license = "MIT"

[features]
# A live JS channel into the attached game, for research. Off by default: a
# released build must not carry the ability to evaluate arbitrary code against
# another process, which would make a signed binary a general memory reader.
devtools = []

[dependencies]
gpui = "0.2"
rquickjs = { version = "0.13", features = ["loader", "macro"] }
# self-update and script sync from GitHub
ureq = "2"
serde_json = "1"
sha2 = "0.10"
sha1_smol = "1"
# fit game artwork to the banner (already in the tree via gpui)
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }


[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
]

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
