# Script tooling: types and tests. Runs only when scripts change.
name: scripts

on:
  pull_request:
    paths: &paths
      - 'configs/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/scripts.yml'
  push:
    branches: [main]
    paths: *paths

concurrency:
  group: scripts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
