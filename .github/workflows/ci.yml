# Runs on every pull request and on pushes to main.
name: ci

on:
  pull_request:
    paths-ignore: &docs
      - '**.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore: *docs

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Scripts - format, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Formatting (prettier)
        run: npm run format:check
      - name: Types (tsc over JSDoc)
        run: npm run typecheck
      - name: Tests (golden hook bytes, config contracts, unreal.js)
        run: npm test

  app:
    name: App - build and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Builds every binary as a test harness, so a broken helper tool fails
      # here too. Includes loading each config in the real QuickJS host.
      - name: cargo test
        run: cargo test --release
